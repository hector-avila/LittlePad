[package]
name = "relay-server"
version = "0.1.0"
description = "LittlePad share relay: a stateless WebSocket relay for real-time file sharing between LittlePad instances. Never persists anything to disk and never sees document content or passwords in the clear."
authors = ["Héctor Ávila"]
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "littlepad-relay-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
