# Builds LittlePad for Windows, macOS (Intel + Apple Silicon), and Linux.
# Triggered by pushing a v* tag (e.g. v0.1.0) or manually from Actions.
# Publishes plain executables for Windows/Linux, and a LittlePad.app bundle
# (no .dmg) for macOS — see scripts/build-macos.sh for why macOS needs a
# .app instead of a plain binary — as a draft Release on GitHub.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # Apple Silicon (arm64)
            args: '--target aarch64-apple-darwin --bundles app'
            uploadPlainBinary: false
          - platform: macos-latest        # Intel (x86_64)
            args: '--target x86_64-apple-darwin --bundles app'
            uploadPlainBinary: false
          - platform: ubuntu-22.04        # plain executable
            args: '--no-bundle'
            uploadPlainBinary: true
          - platform: windows-latest      # plain .exe
            args: '--no-bundle'
            uploadPlainBinary: true

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # "." (the repo root), not "src-tauri" — src-tauri became a Cargo
          # workspace member when relay-server/ was added (see /Cargo.toml).
          workspaces: .

      - name: System dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libfontconfig1-dev libfreetype6-dev pkg-config

      - name: npm dependencies
        run: npm ci

      - name: Generate icons from app-icon.svg
        run: npm run tauri icon app-icon.svg

      # Pulls this version's bullet list straight out of CHANGELOG.md, so the
      # release notes (and the in-app "update available" dialog, which reads
      # them back from the published release — see services/updateCheck.ts)
      # don't depend on hand-editing the draft before publishing. Falls back
      # to a generic line if the tag's version has no matching entry yet
      # (e.g. a workflow_dispatch run off a branch, not a tag).
      - name: Extract changelog for this release
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(node scripts/extract-changelog.mjs "$VERSION" 2>/dev/null || true)"
          if [ -z "$NOTES" ]; then
            NOTES="Generated automatically — see CHANGELOG.md."
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LittlePad ${{ github.ref_name }}'
          releaseBody: |-
            Plain executables for Windows/Linux, and a LittlePad.app bundle
            (no installer/.dmg) for macOS — generated automatically.

            ${{ steps.changelog.outputs.notes }}
          releaseDraft: true
          # true (plain binary, requires --no-bundle) for Windows/Linux;
          # false (upload the .app bundle tauri-action itself zips up,
          # requires --bundles app) for macOS — see uploadPlainBinary per
          # matrix entry above.
          # https://github.com/tauri-apps/tauri-action#inputsuploadplainbinary
          uploadPlainBinary: ${{ matrix.uploadPlainBinary }}
          args: ${{ matrix.args }}

  # Builds the standalone share relay server (see relay-server/ and Settings
  # -> Share) and attaches it to the same draft release as the app — Linux
  # only, self-hosted-on-a-server being the expected deployment; Windows/
  # macOS users who want to run it locally build it themselves
  # (`cargo build --release -p relay-server`, already done by
  # scripts/build-windows.bat and scripts/build-macos.sh).
  build-relay:
    needs: build
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: littlepad-relay-server-linux-x86_64
          - runner: ubuntu-22.04-arm
            asset: littlepad-relay-server-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build relay server
        run: cargo build --release -p relay-server

      - name: Rename artifact
        run: cp target/release/littlepad-relay-server ${{ matrix.asset }}

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ matrix.asset }}
